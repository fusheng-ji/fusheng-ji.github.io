<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Human2Robot representation study</title>
  <desc id="desc">A technical plate connecting a frozen human trace, an interaction representation, and a robot consequence.</desc>
  <rect width="640" height="360" fill="#09111d"/>
  <g stroke="#64748b" stroke-opacity=".18">
    <path d="M0 60H640M0 120H640M0 180H640M0 240H640M0 300H640"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360"/>
  </g>
  <text x="36" y="42" fill="#67e8f9" font-family="monospace" font-size="12" letter-spacing="2">H2R / REPRESENTATION STUDY</text>
  <text x="36" y="82" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="25" font-weight="700">What must survive?</text>
  <g transform="translate(36 122)">
    <rect width="156" height="150" fill="#0d1826" stroke="#64748b" stroke-opacity=".45"/>
    <text x="14" y="24" fill="#94a3b8" font-family="monospace" font-size="10">HUMAN TRACE</text>
    <path d="M22 112C58 52 98 55 134 112" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="73" y="76" width="18" height="36" rx="7" fill="#b7a6d9" stroke="#eee8ff"/>
    <circle cx="82" cy="68" r="18" fill="none" stroke="#67e8f9" stroke-dasharray="4 4"/>
  </g>
  <path d="M204 197H224" stroke="#67e8f9" stroke-width="2"/><path d="M218 191L224 197L218 203" fill="none" stroke="#67e8f9" stroke-width="2"/>
  <g transform="translate(236 122)">
    <rect width="168" height="150" fill="#0d1826" stroke="#67e8f9" stroke-opacity=".55"/>
    <text x="14" y="24" fill="#94a3b8" font-family="monospace" font-size="10">INVARIANTS</text>
    <g fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
      <text x="36" y="54">object identity</text><text x="36" y="76">relative geometry</text>
      <text x="36" y="98">contact state</text><text x="36" y="120">outcome + feasibility</text>
    </g>
    <g fill="#6ee7b7" font-family="monospace" font-size="12"><text x="16" y="54">✓</text><text x="16" y="76">✓</text><text x="16" y="98">✓</text><text x="16" y="120">✓</text></g>
  </g>
  <path d="M416 197H436" stroke="#67e8f9" stroke-width="2"/><path d="M430 191L436 197L430 203" fill="none" stroke="#67e8f9" stroke-width="2"/>
  <g transform="translate(448 122)">
    <rect width="156" height="150" fill="#0d1826" stroke="#64748b" stroke-opacity=".45"/>
    <text x="14" y="24" fill="#94a3b8" font-family="monospace" font-size="10">ROBOT CONSEQUENCE</text>
    <path d="M20 112L43 75L76 57L116 77" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0d1826" stroke="#67e8f9" stroke-width="3"><circle cx="43" cy="75" r="7"/><circle cx="76" cy="57" r="7"/></g>
    <rect x="110" y="76" width="14" height="35" rx="4" fill="#b7a6d9"/>
    <rect x="126" y="101" width="22" height="11" fill="none" stroke="#67e8f9"/>
  </g>
  <text x="36" y="316" fill="#94a3b8" font-family="monospace" font-size="11">SAME DEMONSTRATION · SAME SCENE · SEED 7303</text>
  <text x="36" y="338" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">Pose replay → object-centric → contact-aware</text>
